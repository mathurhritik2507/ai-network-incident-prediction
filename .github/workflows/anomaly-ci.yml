name: Anomaly CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scikit-learn streamlit plotly joblib pytest
      - run: python -m pytest -q tests/test_anomaly.py
      - run: python train_anomaly.py
